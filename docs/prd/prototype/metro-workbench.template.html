<div id="metro-prd-workbench">
  <style>
    #metro-prd-workbench{--mw-bg:#f4f6f5;--mw-surface:#fff;--mw-text:#182a2f;--mw-muted:#53676d;--mw-line:#d9e2e2;--mw-accent:#146a73;--mw-soft:#e7f2f1;--mw-warn:#8a5900;color:var(--mw-text);background:var(--mw-bg);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;max-width:1400px;margin:auto;color-scheme:light}
    #metro-prd-workbench *{box-sizing:border-box}#metro-prd-workbench button,#metro-prd-workbench input,#metro-prd-workbench select{font:inherit}#metro-prd-workbench button{cursor:pointer}#metro-prd-workbench button:focus-visible,#metro-prd-workbench input:focus-visible,#metro-prd-workbench select:focus-visible{outline:2px solid var(--mw-accent);outline-offset:3px}
    #metro-prd-workbench .mw-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap;padding:18px 28px;background:var(--mw-surface);border-bottom:1px solid var(--mw-line)}#metro-prd-workbench .mw-brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-size:19px;font-weight:650}#metro-prd-workbench .mw-logo{background:var(--mw-accent);color:#fff;border-radius:6px;width:32px;height:32px;text-align:center;line-height:32px}
    #metro-prd-workbench .mw-nav{display:flex;gap:16px;flex-wrap:wrap}#metro-prd-workbench .mw-nav button{border:0;background:none;color:var(--mw-muted);padding:7px 0;border-bottom:2px solid transparent}#metro-prd-workbench .mw-nav button[aria-pressed=true]{color:var(--mw-accent);border-color:var(--mw-accent);font-weight:650}#metro-prd-workbench .mw-stage{padding:28px}#metro-prd-workbench .mw-eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mw-muted)}#metro-prd-workbench h1{font-size:28px;line-height:1.3;margin:8px 0 12px}#metro-prd-workbench h2{font-size:17px;margin:0}#metro-prd-workbench h3{font-size:15px;margin:0 0 10px}#metro-prd-workbench p{margin:6px 0}#metro-prd-workbench .mw-muted{color:var(--mw-muted);font-size:12px}#metro-prd-workbench .mw-note{display:flex;flex-wrap:wrap;gap:10px 22px;color:var(--mw-muted);font-size:12px;margin:10px 0 20px}#metro-prd-workbench .mw-pending{color:var(--mw-warn);background:#fff4db;padding:2px 8px;border-radius:4px}
    #metro-prd-workbench .mw-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:20px 0}#metro-prd-workbench label{display:flex;flex-direction:column;gap:6px;color:var(--mw-muted);font-size:12px}#metro-prd-workbench input,#metro-prd-workbench select{padding:8px 12px;min-height:40px;color:var(--mw-text);border:1px solid var(--mw-line);background:var(--mw-surface);border-radius:5px;max-width:100%}#metro-prd-workbench .mw-search{flex:1;min-width:170px}#metro-prd-workbench .mw-button{padding:8px 12px;min-height:40px;border:1px solid var(--mw-line);border-radius:5px;color:var(--mw-accent);background:var(--mw-surface)}#metro-prd-workbench .mw-button.primary{background:var(--mw-accent);color:#fff;border-color:var(--mw-accent)}#metro-prd-workbench .mw-button[disabled]{opacity:.5;cursor:not-allowed}
    #metro-prd-workbench .mw-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px;align-items:start}#metro-prd-workbench .mw-panel{background:var(--mw-surface);border:1px solid var(--mw-line);border-radius:8px;overflow:hidden;min-width:0}#metro-prd-workbench .mw-panel-head{padding:17px 20px;border-bottom:1px solid var(--mw-line);display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}#metro-prd-workbench .mw-body{padding:20px}#metro-prd-workbench .mw-metric{font-size:34px;line-height:1.25;font-weight:650;font-variant-numeric:tabular-nums;margin:12px 0 4px}#metro-prd-workbench .mw-metric small{font-weight:400;font-size:12px;margin-left:8px}#metro-prd-workbench .mw-table{width:100%;border-collapse:collapse}#metro-prd-workbench th{background:#f8faf9;text-align:left;color:var(--mw-muted);font-size:12px;font-weight:500}#metro-prd-workbench td,#metro-prd-workbench th{padding:11px 16px;border-bottom:1px solid #e8edec;vertical-align:middle}#metro-prd-workbench td.num,#metro-prd-workbench th.num{text-align:right;font-variant-numeric:tabular-nums}#metro-prd-workbench .mw-city{border:0;background:none;padding:4px 0;color:var(--mw-text);font-weight:600;text-align:left}#metro-prd-workbench .mw-row-selected{background:var(--mw-soft)}#metro-prd-workbench .mw-mini{padding:4px 8px;min-height:32px;font-size:12px}#metro-prd-workbench .mw-dash{border-top:1px solid var(--mw-line);margin-top:18px;padding-top:14px}#metro-prd-workbench .mw-tray{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px;padding:14px 16px;background:var(--mw-surface);border:1px solid var(--mw-line);border-radius:7px}#metro-prd-workbench .mw-chip{font-size:12px;color:var(--mw-accent);background:var(--mw-soft);border:0;border-radius:4px;padding:5px 9px;min-height:32px}#metro-prd-workbench .mw-grow{flex:1}
    #metro-prd-workbench .mw-bars{display:grid;gap:16px;padding-top:12px}#metro-prd-workbench .mw-bar-row{display:grid;grid-template-columns:60px minmax(40px,1fr) 70px;gap:12px;align-items:center}#metro-prd-workbench .mw-track{height:12px;background:#edf2f0;border-radius:2px;overflow:hidden}#metro-prd-workbench .mw-fill{height:100%;background:var(--mw-accent)}#metro-prd-workbench .mw-barnum{text-align:right;font-variant-numeric:tabular-nums}#metro-prd-workbench .mw-source{font-size:12px;color:var(--mw-muted);line-height:1.8;margin-top:12px}#metro-prd-workbench .mw-source dl{display:grid;grid-template-columns:86px 1fr;gap:7px;margin:12px 0}#metro-prd-workbench .mw-source dd{margin:0;overflow-wrap:anywhere}#metro-prd-workbench .mw-source dt{margin:0}#metro-prd-workbench .mw-source a{color:var(--mw-accent)}#metro-prd-workbench .mw-foot{padding:14px 28px;border-top:1px solid var(--mw-line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:11px;color:var(--mw-muted)}#metro-prd-workbench .mw-empty{padding:30px 20px;text-align:center;color:var(--mw-muted)}#metro-prd-workbench [hidden]{display:none!important}#metro-prd-workbench #mw-status{font-size:12px;color:var(--mw-muted);padding-top:8px;min-height:26px}
    @media(max-width:760px){#metro-prd-workbench .mw-layout{grid-template-columns:1fr}#metro-prd-workbench .mw-stage{padding:20px 16px}#metro-prd-workbench .mw-top{padding:16px;gap:12px}#metro-prd-workbench .mw-brand{width:100%}#metro-prd-workbench .mw-foot{padding:14px 16px}#metro-prd-workbench input,#metro-prd-workbench select{font-size:16px}#metro-prd-workbench th,#metro-prd-workbench td{padding:10px}#metro-prd-workbench h1{font-size:24px}#metro-prd-workbench .mw-button{min-height:44px}#metro-prd-workbench .mw-bar-row{grid-template-columns:54px minmax(30px,1fr) 64px;gap:8px}}
    @media(prefers-reduced-motion:no-preference){#metro-prd-workbench .mw-fill{transition:width .18s ease}}
  </style>
  <header class="mw-top">
    <div class="mw-brand"><span class="mw-logo">M</span>MetroViz <span class="mw-muted">城市地铁客流研究台</span></div>
    <nav class="mw-nav" aria-label="示意页面"><button type="button" data-view="overview" aria-pressed="true">全国概览</button><button type="button" data-view="detail" aria-pressed="false">城市档案</button><button type="button" data-view="compare" aria-pressed="false">对标分析</button></nav>
  </header>
  <main class="mw-stage">
    <div class="mw-eyebrow">METROVIZ / RESEARCH WORKSPACE</div>
    <h1 id="mw-title">全国客流概览</h1>
    <div class="mw-note"><span id="mw-context"></span><span>最近采集 2026-05-08</span><span class="mw-pending">资料浏览 · 口径待核验</span></div>
    <div class="mw-controls">
      <label>观察指标<select id="mw-metric"><option value="annual">年度日均客流</option><option value="snapshot">日客流快照</option></select></label>
      <label id="mw-year-wrap">年份<select id="mw-year"><option>2025</option><option>2024</option><option>2023</option><option>2022</option></select></label>
      <label class="mw-search" id="mw-search-wrap">查找城市<input id="mw-search" type="search" placeholder="城市名或拼音，例如 杭州"></label>
      <label id="mw-sort-wrap">列表顺序<select id="mw-sort"><option value="name">城市名称</option><option value="value">按源值排序</option></select></label>
    </div>
    <section id="mw-overview" class="mw-layout">
      <div class="mw-panel"><div class="mw-panel-head"><h2>城市资料</h2><span class="mw-muted" id="mw-list-count"></span></div><table class="mw-table"><thead><tr><th>城市</th><th class="num" id="mw-value-head">万人次每日</th><th>对标</th></tr></thead><tbody id="mw-rows"></tbody></table><div class="mw-body"><button id="mw-expand" class="mw-button mw-mini" type="button">显示全部城市</button></div></div>
      <aside class="mw-panel"><div class="mw-panel-head"><h2 id="mw-preview-name">厦门</h2><span class="mw-muted">城市摘要</span></div><div class="mw-body" id="mw-preview"></div></aside>
    </section>
    <section id="mw-detail" hidden></section>
    <section id="mw-compare" hidden></section>
    <div class="mw-tray" id="mw-tray"></div>
    <div id="mw-status" role="status" aria-live="polite"></div>
  </main>
  <footer class="mw-foot"><span>产品交互示意 v1.0 · 仓库公开数据快照 · 不代表当前运营状态</span><span>原始来源 MetroDB.org · 未接入实时数据</span></footer>
  <script type="application/json" id="mw-data">__METRO_DATA__</script>
  <script>
    (()=>{
      const root=document.getElementById('metro-prd-workbench');
      const $=id=>root.querySelector('#'+id);
      const data=JSON.parse($('mw-data').textContent);
      const byId=new Map(data.map(d=>[d.city,d]));
      let current='overview',focused='xiamen',picked=[],expanded=false;
      const metric=()=>$('mw-metric').value;
      const year=()=>Number($('mw-year').value);
      const val=d=>metric()==='snapshot'?(d.daily>0?d.daily:null):(d.annual[String(year())]??null);
      const fmt=v=>v===null?'—':v.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
      const period=()=>metric()==='annual'?year()+' 年年度记录':'日快照 · 统计日期未提供';
      const unit=()=>metric()==='annual'?'万人次每日':'万人次';
      const metricTitle=()=>metric()==='annual'?'年度日均客流':'日客流快照';
      const addButton=d=>'<button class="mw-button mw-mini" type="button" data-pick="'+d.city+'">'+(picked.includes(d.city)?'已加入':'＋ 加入')+'</button>';
      const source=d=>'<div class="mw-source"><h3>数据依据</h3><dl><dt>统计期间</dt><dd>'+period()+'</dd><dt>采集日期</dt><dd>2026-05-08</dd><dt>核验状态</dt><dd>来源定义与跨城口径待核验</dd><dt>原始来源</dt><dd><a target="_blank" rel="noopener" href="https://metrodb.org/index/'+d.city+'.html">MetroDB · '+d.name+'</a></dd></dl></div>';
      function status(text){$('mw-status').textContent=text;}
      function changeView(v){current=v;render();}
      function render(){
        root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===current)));
        ['overview','detail','compare'].forEach(v=>$('mw-'+v).hidden=v!==current);
        $('mw-title').textContent={overview:'全国客流概览',detail:byId.get(focused).name+'城市档案',compare:'城市对标分析'}[current];
        $('mw-year-wrap').hidden=metric()!=='annual';
        $('mw-search-wrap').hidden=current!=='overview';$('mw-sort-wrap').hidden=current!=='overview';
        $('mw-context').textContent=metricTitle()+' · '+period()+' · '+data.filter(d=>val(d)!==null).length+' 城有记录 / 收录 50 城';
        renderOverview();renderDetail();renderCompare();renderTray();
      }
      function renderOverview(){
        const query=$('mw-search').value.trim().toLowerCase();
        let found=data.filter(d=>d.name.includes(query)||d.city.includes(query));
        found.sort((a,b)=>$('mw-sort').value==='value'?(val(b)??-1)-(val(a)??-1):a.name.localeCompare(b.name,'zh-CN'));
        const visible=expanded?found:found.slice(0,8);
        $('mw-list-count').textContent='展示 '+visible.length+' / '+found.length+' 城';
        $('mw-value-head').textContent=unit();
        $('mw-rows').innerHTML=visible.map(d=>'<tr class="'+(d.city===focused?'mw-row-selected':'')+'"><td><button class="mw-city" type="button" data-focus="'+d.city+'">'+d.name+'</button></td><td class="num">'+fmt(val(d))+(val(d)===null?'<div class="mw-muted">该指标未收录</div>':'')+'</td><td>'+addButton(d)+'</td></tr>').join('')||( '<tr><td colspan="3" class="mw-empty">未找到城市，请调整搜索词。</td></tr>');
        $('mw-expand').hidden=found.length<=8;$('mw-expand').textContent=expanded?'收起城市列表':'显示全部城市';
        const d=byId.get(focused);$('mw-preview-name').textContent=d.name;
        $('mw-preview').innerHTML='<div class="mw-muted">'+period()+'</div><div class="mw-metric">'+fmt(val(d))+'<small>'+unit()+'</small></div><p class="mw-muted">'+(val(d)===null?'当前指标缺失，可切换年度资料。':'来源值可查阅，严格可比性尚未核验。')+'</p><div class="mw-dash">'+source(d)+'</div><button class="mw-button primary" type="button" data-open="'+d.city+'">查看城市档案 →</button>';
      }
      function renderDetail(){
        const d=byId.get(focused);const years=[2021,2022,2023,2024,2025].filter(y=>d.annual[y]!==undefined);const max=Math.max(...years.map(y=>d.annual[y]),1);
        $('mw-detail').innerHTML='<div class="mw-layout"><div class="mw-panel"><div class="mw-panel-head"><h2>年度客流资料</h2><span class="mw-muted">万人次每日</span></div><div class="mw-body"><p class="mw-muted">'+period()+' · '+metricTitle()+'</p><div class="mw-metric">'+fmt(val(d))+'<small>'+unit()+'</small></div><div class="mw-bars">'+years.map(y=>'<div class="mw-bar-row"><span>'+y+'</span><div class="mw-track"><div class="mw-fill" style="width:'+(d.annual[y]/max*100)+'%"></div></div><span class="mw-barnum">'+fmt(d.annual[y])+'</span></div>').join('')+'</div><p class="mw-muted mw-dash">2026 年期间完整性未确认，未并入本组年度记录。</p></div></div><aside class="mw-panel"><div class="mw-panel-head"><h2>来源与下一步</h2>'+addButton(d)+'</div><div class="mw-body">'+source(d)+'<div class="mw-dash"><h3>运营资料快照</h3><p>'+d.km+' 公里</p><p class="mw-muted">统计时点未提供，未用于计算所选年度客流强度。</p></div><p class="mw-muted mw-dash">线网查看器沿用现有项目，详见页面规格 P-05。</p></div></aside></div>';
      }
      function renderCompare(){
        const cities=picked.map(id=>byId.get(id));
        if(cities.length<2){$('mw-compare').innerHTML='<div class="mw-panel mw-empty"><h2>选择至少两座城市</h2><p>从全国概览加入城市，或查看一个示例组合。</p><button class="mw-button" id="mw-example" type="button">查看北京、上海、深圳示例</button></div>';return;}
        const max=Math.max(...cities.map(d=>val(d)??0),1);
        $('mw-compare').innerHTML='<div class="mw-panel"><div class="mw-panel-head"><h2>'+metricTitle()+'原值对照</h2><span class="mw-muted">'+unit()+'</span></div><div class="mw-body"><p class="mw-pending">'+cities.length+' 城来源口径待核验，当前仅浏览资料，不生成严格排名或相对结论。</p><div class="mw-bars">'+cities.map(d=>'<div class="mw-bar-row"><button class="mw-city" data-open="'+d.city+'" type="button">'+d.name+'</button><div class="mw-track"><div class="mw-fill" style="width:'+((val(d)??0)/max*100)+'%"></div></div><span class="mw-barnum">'+fmt(val(d))+'</span></div>').join('')+'</div><p class="mw-muted mw-dash">期间 '+period()+' · 采集 2026-05-08 · 缺失值保留为空</p><p class="mw-muted">客流规模、运营里程与客流强度分别解释；不合成运营实力评分。</p></div></div>';
      }
      function renderTray(){
        $('mw-tray').innerHTML='<span>对比篮 <span class="mw-muted">'+picked.length+'/5</span></span>'+picked.map(id=>'<button class="mw-chip" data-remove="'+id+'" type="button" aria-label="移除'+byId.get(id).name+'">'+byId.get(id).name+' ×</button>').join('')+'<span class="mw-grow"></span><button class="mw-button primary" data-go-compare type="button" '+(picked.length<2?'disabled':'')+'>进入对标 →</button>';
      }
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b)return;
        if(b.dataset.view){changeView(b.dataset.view);return;}
        if(b.dataset.focus){focused=b.dataset.focus;render();return;}
        if(b.dataset.open){focused=b.dataset.open;changeView('detail');return;}
        if(b.dataset.pick){const id=b.dataset.pick;if(picked.includes(id)){status('该城市已在对比篮中。');return;}if(picked.length===5){status('最多选择五座城市，请先移除一个。');return;}picked.push(id);render();status(byId.get(id).name+'已加入对比篮。');return;}
        if(b.dataset.remove){picked=picked.filter(id=>id!==b.dataset.remove);render();status('已移除城市。');return;}
        if(b.hasAttribute('data-go-compare')){changeView('compare');return;}
        if(b.id==='mw-expand'){expanded=!expanded;render();return;}
        if(b.id==='mw-example'){picked=['beijing','shanghai','shenzhen'];render();status('已载入示例城市组合。');}
      });
      $('mw-metric').addEventListener('change',render);$('mw-year').addEventListener('change',render);$('mw-sort').addEventListener('change',renderOverview);$('mw-search').addEventListener('input',()=>{expanded=false;renderOverview();});render();
    })();
  </script>
</div>
