name: Scheduled Data Increment Update

on:
  schedule:
    # 每月 1 号 00:00 UTC（北京时间上午 08:00），以维持最低频、低骚扰的采集标准
    - cron: '0 0 1 * *'
  workflow_dispatch:
    # 允许维护人员在 Web UI 随时一键手动触发与调试
    inputs:
      mode:
        description: "运行模式"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - write

permissions:
  contents: read
  pull-requests: read

jobs:
  scheduled-update:
    name: Run Scheduled Data Update
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install System and Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4 lxml
        npm ci

    - name: Run Data Update Orchestration
      id: update-step
      run: |
        # 默认定时任务没有 github.event.inputs.mode，强制采用安全的 write 流程（生成 PR 而不是直接 push）
        RUN_MODE="${{ github.event.inputs.mode || 'write' }}"
        
        set +e
        if [ "$RUN_MODE" = "write" ]; then
          log "[CI] 正在运行 write 覆盖模式..."
          python scripts/run_data_update.py --write --confirm-write
        else
          log "[CI] 正在运行 dry-run 演练模式..."
          python scripts/run_data_update.py --dry-run
        fi
        UPDATE_EXIT=$?
        set -e

        if [ "$UPDATE_EXIT" = "0" ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
          echo "[CI] 数据无变动或对齐完毕。"
        elif [ "$UPDATE_EXIT" = "10" ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "[CI] 数据发现实质性变动。"
        elif [ "$UPDATE_EXIT" = "20" ]; then
          echo "::error::Staging validation failed or data anomaly threshold triggered."
          exit 20
        else
          echo "::error::Unexpected exit code from run_data_update: $UPDATE_EXIT"
          exit "$UPDATE_EXIT"
        fi
      shell: bash

    - name: Upload Data Diff Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: data-update-diff-report
        path: |
          output/data_diff_report.json
          output/data_diff_report.md
        if-no-files-found: ignore

    - name: Check Bot Token Secret Presence
      if: steps.update-step.outputs.has_changes == 'true' && (github.event.inputs.mode || 'write') == 'write'
      run: |
        if [ -z "${{ secrets.DATA_UPDATE_BOT_TOKEN }}" ]; then
          echo "::error::DATA_UPDATE_BOT_TOKEN is required to create automated PR. Please configure it in your Repository Secrets."
          exit 1
        fi
      shell: bash

    - name: Generate YYYY-MM Metadata
      if: steps.update-step.outputs.has_changes == 'true' && (github.event.inputs.mode || 'write') == 'write'
      id: meta
      run: |
        echo "month=$(date +'%Y-%m')" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Create Automated Pull Request
      if: steps.update-step.outputs.has_changes == 'true' && (github.event.inputs.mode || 'write') == 'write'
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.DATA_UPDATE_BOT_TOKEN }}
        branch: data-update/update-${{ steps.meta.outputs.month }}
        commit-message: "data: update metro snapshot ${{ steps.meta.outputs.month }}"
        title: "data: update metro snapshot ${{ steps.meta.outputs.month }}"
        body-path: output/data_diff_report.md
        labels: |
          data-pipeline
          automated-pr
        draft: false
