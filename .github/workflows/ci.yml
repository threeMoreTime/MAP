name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  data-check:
    name: Data Layer Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Install Root Dependencies
      run: npm ci

    - name: Run Data Validation
      run: npm run test:data

    - name: Run Pipeline Unit Tests
      run: npm run test:pipeline

  react-check:
    name: React Frontend Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Run React Typecheck
      working-directory: frontend
      run: npm run typecheck

    - name: Run ESLint
      working-directory: frontend
      run: npm run lint

    - name: Run Unit Tests
      working-directory: frontend
      run: npm run test:unit

    - name: Build React Application
      working-directory: frontend
      run: npm run build

    - name: Run Static Build Check
      working-directory: frontend
      run: npm run check:static

  react-ui-test:
    name: React Frontend UI Test
    needs: react-check
    runs-on: ubuntu-latest

    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Print Chrome Version
      run: google-chrome --version

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Build React Application
      working-directory: frontend
      run: npm run build

    - name: Run React UI Acceptance Tests
      working-directory: frontend
      run: npm run test:ui

  freshness-check:
    # 数据鲜活度是业务信号而非代码故障：stale 不判定本 job 失败，
    # 避免"数据过期"阻断代码 CI 与 Pages 部署（数据刷新走独立的 data-update PR 流程）。
    # manifest 缺失/损坏仍会由 data-check 的数据校验兜底阻断。
    name: Data Freshness Signal
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Check Data Freshness (45 days)
      id: freshness
      continue-on-error: true
      run: python scripts/check_freshness.py --max-age-days 45

    - name: Surface Stale-Data Status
      if: always() && steps.freshness.outcome == 'failure'
      run: |
        echo "::warning::数据快照已过期（采集日 ${{ steps.freshness.outputs.scrape_date }}，距今 ${{ steps.freshness.outputs.days }} 天 > 45 天阈值）。此为业务信号，不阻断代码 CI 与 Pages 部署；请手动触发 data-update workflow（write 模式）刷新数据。"
        echo "## ⚠️ 数据鲜活度告警" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "- 数据采集日: ${{ steps.freshness.outputs.scrape_date }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- 距今: ${{ steps.freshness.outputs.days }} 天（阈值 45 天）" >> "$GITHUB_STEP_SUMMARY"
        echo "- 处理: 手动触发 Scheduled Data Increment Update (write 模式) 并审查自动 PR" >> "$GITHUB_STEP_SUMMARY"
      shell: bash

    - name: Open or Update Stale-Data Issue
      if: always() && steps.freshness.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const label = 'data-stale-alert';
          const days = '${{ steps.freshness.outputs.days }}';
          const scrapeDate = '${{ steps.freshness.outputs.scrape_date }}';
          const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
          const title = '数据快照已过期，需要运行数据更新';
          const body = [
            `**数据采集日** ${scrapeDate}，距今 **${days} 天**（阈值 45 天）。`,
            '',
            '上游可能失效或月度更新被平台禁用。处理步骤：',
            '1. 手动触发 [Scheduled Data Increment Update](../actions/workflows/data-update.yml)（write 模式）',
            '2. 审查并合并生成的数据更新 PR',
            '3. 本 issue 将在数据刷新后由维护者关闭',
            '',
            `检查运行: ${runUrl}`,
          ].join('\n');
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: label,
          });
          if (issues.data.length > 0) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues.data[0].number,
              body: `仍在过期状态（距今 ${days} 天）。${runUrl}`,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
          }
